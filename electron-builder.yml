appId: org.jezo.app
productName: Jezo
directories:
  buildResources: build
files:
  - out/**
  - package.json
  # What packages ship for building or other platforms isn't loaded at run time:
  # source maps, type declarations, Linux's seccomp helper, pi-tui's other prebuilds.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/**"
  - "!**/node_modules/@earendil-works/pi-tui/native/{win32,linux}/**"
  - "!**/node_modules/@earendil-works/pi-tui/native/darwin/prebuilds/darwin-x64/**"
# Chromium's own strings (context menus, native dialogs) in the languages Jezo has.
electronLanguages: [en, zh_CN, zh_TW]
# lzfse: smaller to download than the default zlib, on macOS 10.11 and later.
dmg:
  format: ULFO
# The npm launcher uses Electron in Node mode. npm and its own dependencies
# must be real files, including the executables npm's lifecycle scripts call.
asarUnpack:
  - node_modules/npm/**
electronFuses:
  runAsNode: true
mac:
  category: public.app-category.productivity
  extendInfo:
    # Shown when macOS asks for the microphone, the first time ⌥X is held to talk.
    NSMicrophoneUsageDescription: Jezo listens while you hold ⌥X, so you can talk to it instead of typing.
    # Shown when the user connects the Mac's calendars in 連接.
    NSCalendarsFullAccessUsageDescription: Jezo shows your calendars next to your todos, so it can plan around what's already on them.
  extraResources:
    - from: native/eventkit/build/jezo-eventkit
      to: bin/jezo-eventkit
    - from: native/foundation-models/build
      to: bin
      filter:
        - jezo-foundation-models
# What a new workspace starts with (src/main/workspace/seed.ts).
extraResources:
  # uv, for speech recognition's Python environment (scripts/uv.ts).
  - from: vendor/uv
    to: uv
    filter:
      - uv
      - uv.exe
      - LICENSE-*
  - from: resources/workspace
    to: workspace
  - from: resources/workspace.en
    to: workspace.en
  - from: resources/workspace.zh-CN
    to: workspace.zh-CN
