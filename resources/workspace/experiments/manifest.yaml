# What a small experiment is. The app checks every file in items/ against this schema.
kind: experiment
prefix: x
schema:
  type: object
  required: [id, title, state, measure, arms]
  properties:
    id: { type: string, pattern: "^x-" }
    title: { type: string, minLength: 1 }
    state: { enum: [running, finished] }
    measure: { type: string, minLength: 1 }
    arms:
      type: array
      minItems: 2
      items:
        type: object
        required: [label, condition, periods]
        properties:
          label: { type: string, minLength: 1 }
          condition: { type: string }
          periods:
            type: array
            minItems: 1
            items:
              type: object
              required: [from, to]
              properties:
                from: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
                to: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
          value: { type: string }
          basis: { type: string }
    conclusion: { type: string }
    # The user's, picked on the experiment's page once it's finished. Never write it yourself.
    decision: { enum: [adopt, rerun, drop] }
