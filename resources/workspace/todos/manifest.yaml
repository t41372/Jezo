# What a todo is. The app checks every file in items/ against this schema.
kind: todo
prefix: t
schema:
  type: object
  required: [id, title, state]
  properties:
    id: { type: string, pattern: "^t-" }
    title: { type: string, minLength: 1 }
    state: { enum: [draft, open, done, dropped] }
    goal: { type: string }
    cue: { type: string }
    estimate: { type: integer, minimum: 1 }
    amount: { type: number, minimum: 0 }
    scheduled: { type: string, format: jezo-time }
    due: { type: string, format: jezo-deadline }
    series: { type: string, pattern: "^r-" }
    occurrence: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    proposed: { type: boolean }
    rank: { type: string }
    steps:
      type: array
      items:
        type: object
        required: [text, done]
        properties:
          text: { type: string }
          done: { type: boolean }
    why: { type: string }
    started: { type: string, format: jezo-record }
    completed: { type: string, format: jezo-record }
    dropped: { type: string, format: jezo-record }
    created: { type: string, format: jezo-record }
