# What an automation is. The app checks every file in items/ against this schema.
kind: automation
prefix: a
schema:
  type: object
  required: [id, name, schedule, state]
  properties:
    id: { type: string, pattern: "^a-" }
    name: { type: string, minLength: 1 }
    schedule: { type: string, format: jezo-cron }
    state: { enum: [on, off] }
    catch_up: { type: string, format: jezo-catch-up }
    zone: { type: string, format: jezo-zone }
    trigger: { enum: [morning, evening, weekly] }
