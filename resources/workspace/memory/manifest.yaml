# What a memory is. The app checks every file in items/ against this schema.
kind: memory
prefix: m
schema:
  type: object
  required: [id, epistemic, status, recorded, source]
  properties:
    id: { type: string, pattern: "^m-" }
    about: { enum: [preference, fact, pattern, person, commitment] }
    epistemic: { enum: [stated, inferred] }
    status: { enum: [active, superseded] }
    recorded: { type: string }
    source: { type: string }
    evidence: { type: array, items: { type: string } }
    confidence: { enum: [low, medium, high] }
    valid_until: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    supersedes: { type: array, items: { type: string } }
    superseded_by: { type: string }
  if: { properties: { epistemic: { const: inferred } } }
  then: { required: [evidence, confidence] }
