# What a repeating todo is: a series, whose times are todos (docs/design/frontend.md, "Repeating todos").
# The app checks every file in items/ against this schema.
kind: repeat
prefix: r
schema:
  type: object
  required: [id, title, state, rule, start]
  properties:
    id: { type: string, pattern: "^r-" }
    title: { type: string, minLength: 1 }
    state: { enum: [draft, on, ended] }
    rule: { type: string, format: jezo-rrule }
    start: { type: string, format: jezo-deadline }
    from: { enum: [schedule, done] }
    due_after: { type: string, format: jezo-duration }
    last: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    goal: { type: string }
    cue: { type: string }
    estimate: { type: integer, minimum: 1 }
    amount: { type: number, minimum: 0 }
    steps:
      type: array
      items:
        type: object
        required: [text]
        properties:
          text: { type: string }
    created: { type: string, format: jezo-record }
